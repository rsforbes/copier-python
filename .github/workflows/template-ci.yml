# Template CI — generate projects from this template and run their checks, so
# a template change that breaks new projects fails here first.
#
# - `generate`: the generated project's lint, tests, CLI, and pre-commit hooks,
#   for each flavor (the browser flavor adds Playwright, its code, and tests).
# - `devcontainer`: builds and starts each flavor's dev container with the
#   devcontainer CLI (features and post-create included), then checks the
#   tools inside it. This catches breakage in the Dockerfile or post-create,
#   e.g. an apt source or a browser download that stopped working.
# - `pre-commit`: the template repo's own hooks on its root files.
# - `betterleaks-pin`: the generated CI's Betterleaks version and checksum,
#   which Renovate can only half-update.

name: Template CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC: external downloads can break with no commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Copier reads the template's git history and tags
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Generate project
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          uvx copier copy --trust --defaults --vcs-ref HEAD \
            --data-file .github/ci-answers.yml -d flavor="$FLAVOR" \
            . "$RUNNER_TEMP/demo-project"
      - name: Lint
        working-directory: ${{ runner.temp }}/demo-project
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
      # As the generated project's own CI does for the browser flavor.
      - name: Install Playwright's Chromium
        if: matrix.flavor == 'browser'
        working-directory: ${{ runner.temp }}/demo-project
        run: uv run --locked playwright install --with-deps chromium
      - name: Test
        working-directory: ${{ runner.temp }}/demo-project
        run: |
          uv run --locked pytest
          uv run --locked demo-project --version
      # Every hook the generated project's own CI runs (Semgrep, actionlint,
      # zizmor), so a template file a hook flags fails here, not in each new
      # project. Betterleaks is skipped as in the project's CI.
      - name: Run pre-commit hooks
        working-directory: ${{ runner.temp }}/demo-project
        env:
          SKIP: betterleaks
        run: |
          git add -A
          uv run --locked pre-commit run --all-files

  # The template repo's own hooks (.pre-commit-config.yaml at the root) on the
  # root workflows and config. Betterleaks is skipped: it only scans staged
  # changes, so --all-files gives it nothing to do.
  pre-commit:
    name: Template pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run hooks on all files
        # Keep in step with template/pyproject.toml.jinja and .githooks/pre-commit
        # (which says why --python).
        run: uvx --python 3.14 --from 'pre-commit>=4.6,<5' pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: betterleaks
          # Enables zizmor's online audits; read-only (contents: read).
          GH_TOKEN: ${{ github.token }}

  # The generated CI downloads Betterleaks by BETTERLEAKS_VERSION and checks
  # BETTERLEAKS_SHA256. Renovate bumps the version (with the hook revs) but
  # can't compute the checksum, so check here that the version matches both
  # hook revs and the checksum matches the release, before a new project
  # finds out on its first push.
  betterleaks-pin:
    name: Betterleaks pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version and checksum
        run: |
          ci=template/.github/workflows/ci.yml.jinja
          version=$(sed -n 's/^ *BETTERLEAKS_VERSION: *//p' "$ci")
          sha256=$(sed -n 's/^ *BETTERLEAKS_SHA256: *//p' "$ci")
          for config in template/.pre-commit-config.yaml .pre-commit-config.yaml; do
            if ! grep -A1 'repo: https://github.com/betterleaks/betterleaks$' "$config" \
                | grep -q "# frozen: v${version//./\\.}\$"; then
              echo "::error::BETTERLEAKS_VERSION (${version}) in ${ci} does not match the betterleaks rev in ${config}"
              exit 1
            fi
          done
          tarball="betterleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/betterleaks/betterleaks/releases/download/v${version}/${tarball}"
          if ! echo "${sha256}  ${tarball}" | sha256sum -c -; then
            echo "::error::BETTERLEAKS_SHA256 in ${ci} does not match the v${version} release; take the linux_x64 sha256 from its checksums.txt"
            exit 1
          fi

  devcontainer:
    name: Dev container (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Generate project
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          uvx copier copy --trust --defaults --vcs-ref HEAD \
            --data-file .github/ci-answers.yml -d flavor="$FLAVOR" \
            . "$RUNNER_TEMP/demo-project"
      - name: Build and start the dev container
        run: npx --yes @devcontainers/cli@0.89.0 up --workspace-folder "$RUNNER_TEMP/demo-project"
      - name: Check tools inside the container
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          # The script runs in the container's shell, so its $ must not
          # expand here.
          # shellcheck disable=SC2016
          npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder "$RUNNER_TEMP/demo-project" \
            env FLAVOR="$FLAVOR" bash -euc '
              claude --version
              gh --version | head -1
              # The container must use its own venv, not the host .venv in
              # the bind mount (created by the uv sync task in copier.yml).
              test "$(uv run --locked python -c "import sys; print(sys.prefix)")" \
                = "$UV_PROJECT_ENVIRONMENT"
              # For the browser flavor, this includes tests that launch
              # Chromium, which post-create installed.
              uv run --locked pytest
              if [ "$FLAVOR" = browser ]; then
                uv run --locked playwright --version
              fi
            '
