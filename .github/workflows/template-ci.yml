# Template CI — generate projects from this template and run their checks, so
# a template change that breaks new projects fails here first.
#
# - `generate`: the generated project's lint, tests, CLI, and pre-commit hooks,
#   for each flavor (the browser flavor adds Playwright, its code, and tests)
#   and platform (GitHub, or Azure DevOps: its pipeline checked against the
#   Azure Pipelines schema by the project's pre-commit hook).
# - `devcontainer`: builds and starts each flavor's dev container with the
#   devcontainer CLI (features and post-create included), then checks the
#   tools inside it. This catches breakage in the Dockerfile or post-create,
#   e.g. an apt source or a browser download that stopped working.
# - `pre-commit`: the template repo's own hooks on its root files.
# - `betterleaks`: the Azure DevOps CI's cosign checksum, which Renovate can
#   only half-update, then Betterleaks, verified by signature, scanning this
#   repo's full git history for secrets.
# - `passed`: passes only when every job above did. It is the check the main
#   branch ruleset requires (with the PR title check), so adding a flavor or
#   platform, which renames the matrix jobs, doesn't need a ruleset change.

name: Template CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC: external downloads can break with no commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate (${{ matrix.flavor }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, browser]
        platform: [github, azure-devops]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Copier reads the template's git history and tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Generate project
        env:
          FLAVOR: ${{ matrix.flavor }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          uvx copier copy --trust --defaults --vcs-ref HEAD \
            --data-file .github/ci-answers.yml -d flavor="$FLAVOR" -d platform="$PLATFORM" \
            . "$RUNNER_TEMP/demo-project"
      # Each platform gets only its own CI files.
      - name: Check platform files
        working-directory: ${{ runner.temp }}/demo-project
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # One test per line: a failure inside an && list doesn't stop the
          # script.
          if [ "$PLATFORM" = github ]; then
            test -f .github/workflows/ci.yml
            test -f release-please-config.json
            test ! -e azure-pipelines.yml
          else
            test -f azure-pipelines.yml
            test ! -e .github
            test ! -e release-please-config.json
            test ! -e .release-please-manifest.json
            # No link to the GitHub repository it doesn't have.
            if grep -rIl --exclude-dir=.git --exclude-dir=.venv 'github\.com/example' .; then
              exit 1
            fi
          fi
      - name: Lint
        working-directory: ${{ runner.temp }}/demo-project
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
      # As the generated project's own CI does for the browser flavor.
      - name: Install Playwright's Chromium
        if: matrix.flavor == 'browser'
        working-directory: ${{ runner.temp }}/demo-project
        run: uv run --locked playwright install --with-deps chromium
      - name: Test
        working-directory: ${{ runner.temp }}/demo-project
        run: |
          uv run --locked pytest
          uv run --locked demo-project --version
      # Every hook the generated project's own CI runs (Semgrep, and actionlint
      # and zizmor or the Azure Pipelines schema check), so a template file a
      # hook flags fails here, not in each new project. Betterleaks is skipped
      # as in the project's CI.
      - name: Run pre-commit hooks
        working-directory: ${{ runner.temp }}/demo-project
        env:
          SKIP: betterleaks
        run: |
          git add -A
          uv run --locked pre-commit run --all-files

  # The template repo's own hooks (.pre-commit-config.yaml at the root) on the
  # root workflows and config. Betterleaks is skipped: it only scans staged
  # changes, so --all-files gives it nothing to do.
  pre-commit:
    name: Template pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run hooks on all files
        # Keep in step with template/pyproject.toml.jinja and .githooks/pre-commit
        # (which says why --python).
        run: uvx --python 3.14 --from 'pre-commit>=4.6,<5' pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: betterleaks
          # Enables zizmor's online audits; read-only (contents: read).
          GH_TOKEN: ${{ github.token }}

  # A generated project's CI verifies Betterleaks by signature with cosign. On
  # Azure DevOps cosign itself is pinned by release and checksum, which
  # Renovate bumps (cosignRelease) but can't compute, so check the checksum
  # here, before a new project finds out on its first push.
  #
  # Then Betterleaks, verified the same way as in a generated project, scans
  # this repo's own full history, as a generated project's CI does for its
  # own. The hook here only sees staged changes and is skipped above, so
  # without this a secret committed with hooks bypassed would go unseen. False
  # positives go in a root .betterleaksignore (fingerprints;
  # template/.betterleaksignore is only for generated projects), read from
  # main; inline `betterleaks:allow` comments are ignored.
  betterleaks:
    name: Betterleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
      - name: Check the Azure DevOps cosign pin
        run: |
          azure="template/[% if platform == 'azure-devops' %]azure-pipelines.yml[% endif %].jinja"
          release=$(sed -n 's/^ *cosignRelease: *//p' "$azure")
          sha256=$(sed -n 's/^ *cosignSha256: *//p' "$azure")
          if ! printf '%s\n' "$release" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+' \
              || ! printf '%s\n' "$sha256" | grep -qxE '[0-9a-f]{64}'; then
            echo "::error::Could not read one cosignRelease (vX.Y.Z) and one cosignSha256 from ${azure}"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/cosign-azure" \
            "https://github.com/sigstore/cosign/releases/download/${release}/cosign-linux-amd64"
          if ! echo "${sha256}  $RUNNER_TEMP/cosign-azure" | sha256sum -c -; then
            echo "::error::cosignSha256 does not match the ${release} release; take cosign-linux-amd64's sha256 from its cosign_checksums.txt"
            exit 1
          fi

      # The version is read from the betterleaks hook in .pre-commit-config.yaml
      # rather than written here, so the commit-time hook and this scan cannot
      # drift onto different versions. The hook pins a commit SHA with its tag
      # in the `# frozen:` comment; the step checks that the tag still names
      # that commit, so an edit to one without the other fails here. Renovate
      # bumps both.
      - name: Resolve the betterleaks version from the pre-commit config
        id: betterleaks
        run: |
          entry=$(grep -A1 'repo: https://github.com/betterleaks/betterleaks$' .pre-commit-config.yaml \
            | grep '^ *rev: ' || true)
          sha=$(printf '%s\n' "$entry" | sed -n 's/^ *rev: \([0-9a-f]\{40\}\) # frozen: v[0-9][0-9.]*$/\1/p')
          rev=$(printf '%s\n' "$entry" | sed -n 's/^ *rev: [0-9a-f]\{40\} # frozen: \(v[0-9][0-9.]*\)$/\1/p')
          if [ "$(printf '%s\n' "$entry" | wc -l)" -ne 1 ] || [ -z "$sha" ] || [ -z "$rev" ]; then
            echo "::error::Expected one betterleaks hook pinned as 'rev: <sha> # frozen: vX.Y.Z' in .pre-commit-config.yaml"
            exit 1
          fi
          tagged=$(git ls-remote https://github.com/betterleaks/betterleaks "refs/tags/$rev" "refs/tags/$rev^{}" | cut -f1)
          if ! printf '%s\n' "$tagged" | grep -qx "$sha"; then
            echo "::error::betterleaks $rev does not name commit $sha, the rev in .pre-commit-config.yaml"
            exit 1
          fi
          echo "Scanning with betterleaks $rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      # Generated projects run the template's hook, not this repo's. Renovate
      # bumps the two together; check they agree, so the version verified here
      # is the one every new project will verify.
      - name: Check the template's betterleaks hook matches
        run: |
          pin() { grep -A1 'repo: https://github.com/betterleaks/betterleaks$' "$1" | grep '^ *rev: ' | sed 's/^ *//'; }
          if [ "$(pin .pre-commit-config.yaml)" != "$(pin template/.pre-commit-config.yaml.jinja)" ]; then
            echo "::error::The betterleaks rev differs between .pre-commit-config.yaml and template/.pre-commit-config.yaml.jinja"
            exit 1
          fi

      # Installed from the published release binary rather than run as a
      # container image. Three reasons, in order of weight:
      #
      # The archive is verified by signature, so what executes is the binary
      # betterleaks' own release workflow built for this tag, and nothing else.
      # This is the one piece of third-party code that reads the entire tree
      # and full history. betterleaks publishes immutable releases (assets
      # and tag cannot change after publishing) and signs checksums.txt with
      # Sigstore from .github/workflows/release.yml. Checking that signature
      # against the exact tag's workflow identity rejects a checksums.txt that
      # anyone else produced — a stolen upload token included — and the
      # archive is then checked against the signed checksums. This needs no
      # hand edit per release, so a Renovate bump of the hook rev passes on
      # its own and no person reviews the new binary, which is accepted on
      # purpose. Two things guard it: Renovate's 7-day minimumReleaseAge (a
      # bad release usually surfaces within the window) and this signature
      # (only betterleaks' release workflow can produce one).
      #
      # `gh release verify-asset` was considered: it needs no extra tool, but
      # GitHub's release attestation only proves the file was published in a
      # betterleaks release, which a stolen token can also do. The Sigstore
      # identity proves which workflow built it.
      #
      # cosign fetches Sigstore's trusted root online, so a Sigstore outage
      # fails this job. That is the right way to fail for a security gate; a
      # re-run once Sigstore recovers clears it.
      #
      # It is the same delivery the pre-commit hook uses (a Go binary), so the
      # commit-time scan and this one are one mechanism rather than two.
      #
      # And the scan itself runs anywhere the binary does. The dev container
      # has no cosign, so to reproduce a CI result there, install the same
      # release and run the Scan step's command; verification is CI's job.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install betterleaks
        env:
          REV: ${{ steps.betterleaks.outputs.rev }}
        run: |
          ver="${REV#v}"
          archive="betterleaks_${ver}_linux_x64.tar.gz"
          base="https://github.com/betterleaks/betterleaks/releases/download/${REV}"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o checksums.txt "$base/checksums.txt"
          curl -fsSL -o checksums.txt.sigstore.json "$base/checksums.txt.sigstore.json"
          # The identity is the release workflow at this exact tag, not any
          # tag: a signature from another release cannot vouch for this one.
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/betterleaks/betterleaks/.github/workflows/release.yml@refs/tags/${REV}"
          # Exactly one line naming this archive (an exact field match, not a
          # pattern), or the job stops; then sha256sum -c fails it on a hash
          # mismatch.
          awk -v a="$archive" '$2 == a' checksums.txt > archive.sha256
          if [ "$(wc -l < archive.sha256)" -ne 1 ]; then
            echo "::error::Expected exactly one checksum for $archive in checksums.txt"
            exit 1
          fi
          sha256sum -c archive.sha256
          tar xzf "$archive" betterleaks
          ./betterleaks version

      # Suppressions are read from main, never from the code under scan, so a
      # change cannot quietly suppress its own finding: a new allowlist entry or
      # ignored fingerprint reaches main in a pull request of its own first.
      # (A change to this workflow or to the scanner's version can still alter
      # the scan; that is a security change, reviewed as one.) That holds for
      # every run of this job, whatever triggered it, stacked pull requests
      # included. The checkout's own files are replaced with
      # main's before the scan, because betterleaks reads an ignore file from
      # the scan target whatever -i names (.betterleaksignore, or failing that
      # .gitleaksignore), and loads a .betterleaks.toml from it when given no
      # --config before 1.10.0. Where main lacks a file, the scan uses the
      # default rules alone, or ignores nothing. The scan also ignores inline
      # betterleaks:allow comments (--ignore-gitleaks-allow below), which a
      # change could add on any line.
      - name: Replace the suppression files with main's
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout's own files are still scanned for secrets, as plain
          # content: copied aside under names betterleaks doesn't treat as
          # policy, and checked with main's config at the end of this step.
          submitted="$RUNNER_TEMP/submitted"
          mkdir -p "$submitted"
          for f in .betterleaks.toml .betterleaksignore .gitleaksignore; do
            if [ -f "$f" ]; then cp "$f" "$submitted/${f#.}.txt"; fi
          done
          rm -f .betterleaks.toml .betterleaksignore .gitleaksignore
          # .gitleaksignore is read only where main has no .betterleaksignore,
          # as betterleaks itself reads it.
          for f in .betterleaks.toml .betterleaksignore .gitleaksignore; do
            if [ "$f" = .gitleaksignore ] && [ -f .betterleaksignore ]; then continue; fi
            # The contents API reads the default branch when given no ref. A
            # failed or cut-short download, after the retries, reports as 000.
            status=$(curl -sSL --retry 3 --retry-all-errors -o "$f" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw' \
              "$GITHUB_API_URL/repos/$REPO/contents/$f") || status=000
            case "$status" in
              200) echo "Using main's $f" ;;
              404) rm -f "$f" ;;
              *) echo "::error::Could not read $f from main (HTTP $status)"; exit 1 ;;
            esac
          done
          if [ ! -f .betterleaks.toml ]; then
            printf '[extend]\nuseDefault = true\n' > .betterleaks.toml
            echo "main has no .betterleaks.toml; using the default rules alone"
          elif python3 -c 'import sys, tomllib; sys.exit(0 if tomllib.load(open(".betterleaks.toml", "rb")).get("extend", {}).get("path") else 1)'; then
            # An extended file would be read from the checkout, not from main.
            echo "::error::main's .betterleaks.toml uses [extend] path, which this step can't take from main"
            exit 1
          fi
          # The config must still find a secret: one without the default rules,
          # or with a filter that drops everything, would pass every run. The
          # planted value is random, so no secret-shaped literal sits here.
          # --exit-code 3 tells a finding apart from a config that fails to
          # load, which exits 1.
          canary="$RUNNER_TEMP/canary"
          mkdir -p "$canary"
          printf 'db_password = "%s"\n' "$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)" \
            > "$canary/canary.py"
          rc=0
          "$RUNNER_TEMP/betterleaks" dir "$canary" --config .betterleaks.toml --exit-code 3 \
            --no-banner > /dev/null 2>&1 || rc=$?
          case "$rc" in
            3) ;;
            0) echo "::error::main's .betterleaks.toml lets a planted secret through, so the scan would pass anything"; exit 1 ;;
            *) echo "::error::main's .betterleaks.toml could not be used (betterleaks exit $rc)"; exit 1 ;;
          esac
          rc=0
          "$RUNNER_TEMP/betterleaks" dir "$submitted" --config .betterleaks.toml --exit-code 3 \
            --ignore-gitleaks-allow --redact --verbose --no-banner || rc=$?
          case "$rc" in
            0) ;;
            3) echo "::error::A suppression file in the checkout holds what looks like a secret"; exit 1 ;;
            *) echo "::error::Could not scan the checkout's suppression files (betterleaks exit $rc)"; exit 1 ;;
          esac

      - name: Scan git history
        # The suppression files are main's by now (above).
        run: |
          "$RUNNER_TEMP/betterleaks" git --config .betterleaks.toml \
            --ignore-gitleaks-allow --redact --verbose --no-banner .

  devcontainer:
    name: Dev container (${{ matrix.flavor }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, browser]
        platform: [github]
        # The platform changes only the CLI feature, so one Azure DevOps leg.
        include:
          - flavor: base
            platform: azure-devops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Generate project
        env:
          FLAVOR: ${{ matrix.flavor }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          uvx copier copy --trust --defaults --vcs-ref HEAD \
            --data-file .github/ci-answers.yml -d flavor="$FLAVOR" -d platform="$PLATFORM" \
            . "$RUNNER_TEMP/demo-project"
      - name: Build and start the dev container
        run: npx --yes @devcontainers/cli@0.90.0 up --workspace-folder "$RUNNER_TEMP/demo-project"
      - name: Check tools inside the container
        env:
          FLAVOR: ${{ matrix.flavor }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # The script runs in the container's shell, so its $ must not
          # expand here.
          # shellcheck disable=SC2016
          npx --yes @devcontainers/cli@0.90.0 exec --workspace-folder "$RUNNER_TEMP/demo-project" \
            env FLAVOR="$FLAVOR" PLATFORM="$PLATFORM" bash -euc '
              claude --version
              if [ "$PLATFORM" = github ]; then
                gh --version | head -1
              else
                az devops -h >/dev/null && az version
              fi
              # The container must use its own venv, not the host .venv in
              # the bind mount (created by the uv sync task in copier.yml).
              test "$(uv run --locked python -c "import sys; print(sys.prefix)")" \
                = "$UV_PROJECT_ENVIRONMENT"
              # For the browser flavor, this includes tests that launch
              # Chromium, which post-create installed.
              uv run --locked pytest
              if [ "$FLAVOR" = browser ]; then
                uv run --locked playwright --version
              fi
            '

  passed:
    name: Template CI passed
    # always(): a failed or cancelled job must fail this check, not skip it;
    # a ruleset counts a skipped check as passing.
    if: always()
    needs: [generate, pre-commit, betterleaks, devcontainer]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::Not every Template CI job passed: $RESULTS"
              exit 1
            fi
          done
